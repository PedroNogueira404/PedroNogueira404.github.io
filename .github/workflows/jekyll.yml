# .github/workflows/jekyll.yml
name: Build Jekyll site

on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-ruby@v1
      - run: gem install bundler
      - run: bundle install
      - run: bundle exec jekyll build
