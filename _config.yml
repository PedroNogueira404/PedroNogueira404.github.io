title: Pedro Nogueira
theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-multiple-languages-plugin

languages:
  - en
  - pt
  - es
lang: "en"
exclude_from_localizations: ["assets", "js", "images", "favicon.ico"]
i18n_dir: "_i18n"  # Garanta que essa linha esteja correta
# Para evitar conflitos:
future: true
