default_lang: en
title: Pedro Nogueira
languages: ["en", "pt", "es"]

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-multiple-languages-plugin
  - jekyll-last-modified-at

collections:
  codes:
    output: true
    # permalink: /:lang/codes/:slug/
  publications:
    output: true
    permalink: /:lang/publications/:slug/
  blogposts:
    output: true
    permalink: /:lang/blog/:slug/

