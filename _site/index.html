<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Amazing Example Website</title>
</head>
<body>
<script>
    var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    if (lang.startsWith('pt')) {
        window.location = '/pt/';
    } else if (lang.startsWith('es')) {
        window.location = '/es/';
    } else if (lang.startsWith('en')) {
        window.location = '/en/';
    } else {
        window.location = '/en/';
    }
</script>
</body>
</html>
