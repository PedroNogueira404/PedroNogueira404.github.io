<script>

document.addEventListener("DOMContentLoaded", () => {
  // Referências aos elementos principais 
  const isPortraitMobile = window.matchMedia("(max-width: 768px) and (orientation: portrait)").matches;
  const toggleMain = document.getElementById('theme-toggle');
  const langSwitcherLinks = document.querySelectorAll('.language-switcher a');
  const toggleSidebar = document.getElementById('theme-toggle-sidebar');
  const body = document.body;
  const menuToggle = document.getElementById('menu-toggle');
  const navLinks = document.querySelectorAll('.sidebar .nav-link');
  const giscusFrame = document.querySelector('iframe.giscus-frame');
  const sidebar = document.getElementById('sidebar');
  const mainContent = document.querySelector('.main-content');

  langSwitcherLinks.forEach(link => {
    link.addEventListener('click', (e) => {
      const lang = e.target.getAttribute('href').split('=')[1];
      document.documentElement.lang = lang; 
      window.location.search = `?lang=${lang}`; 
    });
  });

  // ================================
  // THEME MANAGEMENT
  // ================================
  // Sets the theme to light or dark mode based on the provided boolean value
  // Function to set the theme of the website to light or dark mode
  // based on the boolean value passed as the parameter `isLight`.
  function setTheme(isLight) {
    if (isLight) {
      // If `isLight` is true, add the 'light-mode' class to the body
      // and store the theme preference as 'light' in localStorage.
      body.classList.add('light-mode');
      localStorage.setItem('theme', 'light');
      return;
    }
    // If `isLight` is false, remove the 'light-mode' class from the body
    // and store the theme preference as 'dark' in localStorage.
    body.classList.remove('light-mode');
    localStorage.setItem('theme', 'dark');
  }

  // Retrieve the saved theme preference from localStorage
  const savedTheme = localStorage.getItem('theme');
  
  // Check if a theme preference exists in localStorage
  if (savedTheme) {
    // Set `isLight` to true if the saved theme is 'light', otherwise false
    isLight = savedTheme === 'light';
  } else {
    // If no saved theme, check the user's system preference for light mode
    const prefersLightScheme = window.matchMedia('(prefers-color-scheme: light)');
    // Set `isLight` based on the system preference
    isLight = prefersLightScheme.matches;
  }

  // Set the initial theme based on the `isLight` variable
  setTheme(isLight);

  // Update the main toggle switch to reflect the current theme
  toggleMain.checked = isLight;
  


    function changeGiscusTheme () {
    const theme = document.documentElement.getAttribute('data-theme') === 'dark' ?  'dark' : 'light'

    function sendMessage(message) {
      const iframe = document.querySelector('iframe.giscus-frame');
      if (!iframe) return;
      iframe.contentWindow.postMessage({ giscus: message }, 'https://giscus.app');
    }

    sendMessage({
      setConfig: {
        theme: theme
      }
    });
  }


  // Check if the sidebar toggle exists
  if (toggleSidebar) {
    // Update the sidebar toggle switch to reflect the current theme
    toggleSidebar.checked = isLight;

    toggleSidebar.addEventListener('change', () => window.setTheme(toggleSidebar.checked));
  }
  
  toggleMain.addEventListener('change', () => {
    setTheme(toggleMain.checked);
    // changeGiscusTheme();

  });

  // ================================
  // MENU TOGGLE
  // ================================

  menuToggle.addEventListener("click", () => {
    const showingMain = body.classList.contains("show-main");
    body.classList.remove("sidebar-only", "show-main");
    requestAnimationFrame(() => {
    body.classList.add(showingMain ? "sidebar-only" : "show-main");
    });
  });

  // ================================
  // SIDEBAR TRANSITION INIT
  // ================================
  const hasEntered = sessionStorage.getItem("entered");
  if (isPortraitMobile) {
    document.body.classList.remove('show-main');
    document.body.classList.add('sidebar-only');
    if (hasEntered === "true") {
      body.classList.remove("show-main", "sidebar-only");
      body.classList.add("show-main");
    } else {
      body.classList.remove("show-main", "sidebar-only");
      body.classList.add("sidebar-only");
      sessionStorage.setItem("entered", "false");
    }
  
    // Update sessionStorage when a sidebar link is clicked
    navLinks.forEach(link => {
      link.addEventListener("click", () => {
        sessionStorage.setItem("entered", "true");
      });
    });

    const transitionDuration = parseFloat(getComputedStyle(body).getPropertyValue('transition-duration')) * 1000 || 100;
    body.classList.add("content-ready");
    setTimeout(() => {
      body.classList.add("content-ready");
    }, transitionDuration);


    // Quando clica no menu hambúrguer
    const toggle = document.getElementById("menu-toggle");
    if (toggle) {
      toggle.addEventListener("click", () => {
        body.classList.toggle("entered");
        const nowEntered = body.classList.contains("entered");
        sessionStorage.setItem("entered", nowEntered ? "true" : "false");
      });
    }
  }

  // ================================
  // REMOVE PRELOAD CLASS
  // ================================
  body.classList.remove('preload');
});
</script>
