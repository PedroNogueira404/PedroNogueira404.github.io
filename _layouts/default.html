<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>{{ page.title | default: "Pedro Henrique Nogueira" }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style_white.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      transition: background-color 0.3s ease;
    }
  body.preload * {
    transition: none !important;
  }
  @media (max-width: 768px) and (orientation: portrait) {
   .sidebar {
    display: none;
  }
  .main-content {
    display: none;
  }
    body.sidebar-only .sidebar {
      display: flex;
    }
    body.sidebar-only .main-content {
      display: none;
    }
    body.show-main .main-content {
      display: block;
    }
  }

  /* Garante que o sidebar não esteja escondido
  .sidebar {
     display: block;
  }*/
  </style>

</head>
<script>
  (function() {
    const isPortraitMobile = window.matchMedia("(max-width: 768px) and (orientation: portrait)").matches;
    if (isPortraitMobile && !localStorage.getItem("entered")) {
      document.body.classList.add("sidebar-only");
      //document.documentElement.className += " sidebar-only";
    }
  })();
</script>
<body class="sidebar-only preload no-transition">


<noscript>
  <p style="text-align: center; background: #ffdddd; padding: 1rem;">
    Este site requer JavaScript para funcionar corretamente. Por favor, habilite o JavaScript no seu navegador.
  </p>
</noscript>

<button id="menu-toggle" class="menu-toggle" aria-label="Open or close navigation menu">&#9776;</button>

<div class="layout-container">
  <div class="sidebar" id="sidebar">
    <!-- perfil, nav, redes, idioma e tema -->
    <div class="sidebar-header">
      <img src="{{ '/assets/profile.jpg' | relative_url }}" alt="Pedro Nogueira" class="profile-img">
      <h1 class="profile-name">Pedro H. Nogueira</h1>
      <p class="profile-title">Astrophysicist</p>
    </div>
    <nav class="main-nav">
      <a href="{{ '/' | relative_url }}" class="nav-link">Home</a>
      <a href="{{ '/portfolio/' | relative_url }}" class="nav-link">Publications</a>
      <a href="{{ '/outreach/' | relative_url }}" class="nav-link">Outreach</a>
      <a href="{{ '/personal/' | relative_url }}" class="nav-link">Personal</a>
      <a href="{{ '/blog/' | relative_url }}" class="nav-link">Blog</a>
      <a href="{{ '/assets/CV.pdf' | relative_url }}" class="nav-link" target="_blank">CV</a>
    </nav>
    <div class="social-links">
      <a href="mailto:nogueirapedro404@gmail.com" class="social-link"><i class="fas fa-envelope"></i></a>
      <a href="https://github.com/PedroNogueira404" target="_blank" class="social-link"><i class="fab fa-github"></i></a>
      <a href="https://www.linkedin.com/in/pedro-henrique-nogueira-8a30571aa" target="_blank" class="social-link"><i class="fab fa-linkedin"></i></a>
      <a href="https://youtube.com/@exopedrito" target="_blank" class="social-link"><i class="fab fa-youtube"></i></a>
      <a href="https://bsky.app/profile/nogueira-astro.bsky.social" target="_blank" class="social-link">
        <img src="/assets/bluesky-logo.svg" alt="Bluesky" class="social-icon bluesky-icon">
      </a>
      <a href="https://twitter.com/nogueira_astro" target="_blank" class="social-link">
        <img src="/assets/x-logo2.svg" alt="X" class="social-icon x-icon">
      </a>
    </div>
    <div class="language-switcher">
      <a href="?lang=pt" class="lang-link"><img src="/assets/br.svg" alt="Portuguese" class="lang-flag"> Português</a>
      <a href="?lang=en" class="lang-link"><img src="/assets/uk.svg" alt="English" class="lang-flag"> English</a>
      <a href="?lang=es" class="lang-link"><img src="/assets/es.svg" alt="Spanish" class="lang-flag"> Español</a>
    </div>
    <div class="switch-container sidebar-switch">
      <label class="switch-label" for="theme-toggle-sidebar">🌗</label>
      <label class="switch">
        <input type="checkbox" id="theme-toggle-sidebar">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="main-content" tabindex="-1">
    {{ content }}

    <div class="switch-container">
      <label class="switch-label" for="theme-toggle">🌗</label>
      <label class="switch">
        <input type="checkbox" id="theme-toggle">
        <span class="slider"></span>
      </label>
    </div>

    {% if page.url contains '/blog/' and page.url != '/blog/' %}
    <div class="comments-section" style="max-height: 400px; overflow-y: auto; margin-top: 2rem;">
      <div id="giscus_container"></div>
      <script src="https://giscus.app/client.js"
              data-repo="PedroNogueira404/PedroNogueira404.github.io"
              data-repo-id="R_kgDOOW9BoA"
              data-category="General"
              data-category-id="DIC_kwDOOW9BoM4Co8kQ"
              data-mapping="pathname"
              data-strict="0"
              data-reactions-enabled="1"
              data-emit-metadata="0"
              data-input-position="bottom"
              data-theme="preferred_color_scheme"
              data-lang="en"
              data-loading="lazy"
              data-comments-enabled="true"
              crossorigin="anonymous"
              async>
      </script>
    </div>
    {% endif %}

    <footer class="site-footer">
      &copy; {{ 'now' | date: "%Y" }} Pedro Nogueira
    </footer>
  </div>
</div>

<script>
console.log("JS carregado");

document.addEventListener("DOMContentLoaded", () => {
  // Referências aos elementos principais
  const toggleMain = document.getElementById('theme-toggle');
  const toggleSidebar = document.getElementById('theme-toggle-sidebar');
  const body = document.body;
  const menuToggle = document.getElementById('menu-toggle');
  const navLinks = document.querySelectorAll('.sidebar .nav-link');
  const giscusFrame = document.querySelector('iframe.giscus-frame');

  const isPortraitMobile = () => window.matchMedia("(max-width: 768px) and (orientation: portrait)").matches;

  // ================================
  // THEME MANAGEMENT
  // ================================
  const savedTheme = localStorage.getItem('theme');
  let isLight;

  if (savedTheme) {
    isLight = savedTheme === 'light';
  } else {
    isLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  }

  function setTheme(isLight) {
    body.classList.toggle('light-mode', isLight);
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    toggleMain.checked = isLight;
    toggleSidebar.checked = isLight;

    try {
      if (giscusFrame && giscusFrame.contentWindow) {
        giscusFrame.contentWindow.postMessage({
          giscus: { setConfig: { theme: isLight ? 'light' : 'dark' } }
        }, 'https://giscus.app');
      }
    } catch (e) {
      console.warn("Giscus theme update failed:", e);
    }
  }

  setTheme(isLight);
  toggleMain.checked = isLight;
  toggleSidebar.checked = isLight;

  toggleMain.addEventListener('change', () => setTheme(toggleMain.checked));
  toggleSidebar.addEventListener('change', () => setTheme(toggleSidebar.checked));

  // ================================
  // MENU TOGGLE
  // ================================
  let manuallyForcedToMain = false;

  menuToggle.addEventListener("click", () => {
    if (body.classList.contains("sidebar-only") || manuallyForcedToMain) {
      body.classList.remove("sidebar-only");
      body.classList.add("show-main");
      manuallyForcedToMain = false;
    } else {
      body.classList.remove("show-main");
      body.classList.add("sidebar-only");
    }
  });

  // ================================
  // LINK CLICK HANDLING
  // ================================
 // document.querySelectorAll("a").forEach(link => {
   // link.addEventListener("click", () => {
     // if (!isPortraitMobile()) return;

     // const isInSidebar = link.closest('.sidebar');
      //body.classList.remove("sidebar-only");
     // body.classList.add("show-main");

    //  manuallyForcedToMain = !isInSidebar;
   // });
  //});

  // ================================
  // SIDEBAR TRANSITION INIT
  // ================================
  if (isPortraitMobile() && !body.classList.contains("show-main")) {
    const alreadyEntered = localStorage.getItem("entered");
    if (!alreadyEntered) {
      body.classList.remove("show-main", "sidebar-only");
      body.classList.add("sidebar-only");
      
      localStorage.setItem("entered", "true");

      setTimeout(() => {
        body.classList.add("content-ready");
      }, 100);
    }
  }

  // ================================
  // TRANSITION ON NAV-LINK CLICK
  // ================================
  navLinks.forEach(link => {
   link.addEventListener("click", () => {
    body.classList.remove("sidebar-only","show-main");
    body.classList.add("show-main");
    manuallyForcedToMain = false;
  });
  });

  /*
  navLinks.forEach(link => {
    link.addEventListener("click", () => {
      if (isPortraitMobile() && !body.classList.contains("show-main")) {
        body.classList.remove("sidebar-only", "show-main");
        void body.offsetWidth; // força reflow
        body.classList.add("show-main");
        manuallyForcedToMain = false;
      }
    });
  });
  */

  // ================================
  // REMOVE PRELOAD CLASS
  // ================================
  body.classList.remove('preload');
});
</script>

  

</body>
</html>
