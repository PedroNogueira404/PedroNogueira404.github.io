<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: "Pedro Henrique Nogueira" }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style_white.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
  <!-- Conteúdo principal da página -->
  <div class="main-content">
    {{ content }}
  </div>

  <!-- Rodapé com ícones de redes sociais -->
  <footer class="site-footer">
    <div class="social-icons">
      <a href="https://github.com/PedroNogueira404" target="_blank" class="social-icon">
        <i class="fab fa-github"></i>
      </a>
      <a href="https://www.linkedin.com/in/pedro-henrique-nogueira-8a30571aa" target="_blank" class="social-icon">
        <i class="fab fa-linkedin"></i>
      </a>
      <a href="https://youtube.com/@exopedrito" target="_blank" class="social-icon">
        <i class="fab fa-youtube"></i>
      </a>
    </div>

    <!-- Mudança de idioma -->
    <div class="language-switcher">
      <a href="?lang=en" class="lang-link">{{ 'english' | t }}</a>
      <a href="?lang=pt" class="lang-link">{{ 'portuguese' | t }}</a>
      <a href="?lang=es" class="lang-link">{{ 'spanish' | t }}</a>
    </div>

    <p>&copy; {{ 'now' | date: "%Y" }} Pedro Nogueira</p>
  </footer>

  <!-- Script de troca de tema -->
  <script>
    const toggleSwitch = document.getElementById('themeSwitch');
    const body = document.body;

    // Aplica o tema salvo
    if (localStorage.getItem('theme') === 'light') {
      body.classList.add('light-mode');
      toggleSwitch.checked = true;
    }

    toggleSwitch.addEventListener('change', function () {
      if (this.checked) {
        body.classList.add('light-mode');
        localStorage.setItem('theme', 'light');
      } else {
        body.classList.remove('light-mode');
        localStorage.setItem('theme', 'dark');
      }
    });
  </script>
</body>
</html>
