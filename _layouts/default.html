<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: sans-serif;
      max-width: 1000px;
      margin: auto;
      padding: 2rem;
      display: flex;
      gap: 2rem;
    }
    nav { margin-bottom: 2rem; }
    nav a { color: #80cbc4; text-decoration: none; margin-right: 1rem; }
    nav a:hover { text-decoration: underline; }
    .sidebar { position: fixed; top: 2rem; left: 2rem; width: 200px; }
    .sidebar img { width: 100%; border-radius: 50%; }
    .sidebar a { display: block; margin-top: 1rem; color: #80cbc4; }
    .sidebar a:hover { text-decoration: underline; }
    .content { flex-grow: 1; }
    footer { margin-top: 3rem; font-size: 0.9rem; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="sidebar">
    <img src="/assets/profile.jpg" alt="Profile" />
    <p><strong>Pedro Nogueira</strong></p>
    <p>Astrophysicist and Science Communicator</p>
    <a href="/about/">About</a>
    <a href="/blog/">Blog</a>
    <a href="/portfolio/">Portfolio</a>
    <a href="/assets/cv.pdf" target="_blank">CV</a>
    <div>
      <a href="https://github.com/PedroNogueira404">GitHub</a>
      <a href="https://www.linkedin.com/in/pedronogueira404">LinkedIn</a>
      <a href="https://youtube.com/@pedronogueira">YouTube</a>
    </div>
  </div>

  <div class="content">
    <nav>
      <a href="/">Home</a>
      <a href="/blog/">Blog</a>
      <a href="/portfolio/">Portfolio</a>
    </nav>

    {{ content }}

    <!-- Giscus comments section -->
    <div id="giscus" data-repo="PedroNogueira404/PedroNogueira404.github.io" data-repo-id="YOUR_REPO_ID" data-category="General" data-category-id="YOUR_CATEGORY_ID" data-mapping="pathname"></div>
  </div>

  <footer>
    <p>Connect: 
      <a href="https://github.com/PedroNogueira404">GitHub</a> | 
      <a href="https://www.linkedin.com/in/pedronogueira404">LinkedIn</a> | 
      <a href="https://youtube.com/@pedronogueira">YouTube</a>
    </p>
  </footer>

  <!-- Giscus Script -->
  <script src="https://giscus.app/client.js" async></script>
</body>
</html>
