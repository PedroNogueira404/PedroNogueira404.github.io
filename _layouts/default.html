<!-- Theme Switching Script -->
<script>
  const toggleMain = document.getElementById('theme-toggle');
  const toggleSidebar = document.getElementById('theme-toggle-sidebar');
  const body = document.body;
  
  const isLight = localStorage.getItem('theme') === 'light';
  if (isLight) {
    body.classList.add('light-mode');
    toggleMain.checked = true;
    toggleSidebar.checked = true;
  }
  
  function setTheme(isLight) {
    body.classList.toggle('light-mode', isLight);
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    toggleMain.checked = isLight;
    toggleSidebar.checked = isLight;
  
    const giscusFrame = document.querySelector('iframe.giscus-frame');
    if (giscusFrame) {
      giscusFrame.contentWindow.postMessage({
        giscus: {
          setConfig: {
            theme: isLight ? 'light' : 'dark'
          }
        }
      }, 'https://giscus.app');
    }
  }
  
  toggleMain.addEventListener('change', () => setTheme(toggleMain.checked));
  toggleSidebar.addEventListener('change', () => setTheme(toggleSidebar.checked));
</script>

<!-- Menu Toggle Script -->
<script>
  // Ao carregar a página, se for mobile retrato, mostre a main-content
  window.addEventListener("DOMContentLoaded", () => {
    const isMobilePortrait = window.innerWidth <= 768 && window.matchMedia("(orientation: portrait)").matches;
    const shouldShowMain = localStorage.getItem('showMainContent') === 'true';
  
    if (isMobilePortrait && shouldShowMain) {
      document.body.classList.add('show-main');
      localStorage.removeItem('showMainContent'); // Limpa o sinalizador
    }
  
    // Observador para evitar flickering (opcional)
    const observer = new MutationObserver(() => {
      if (document.body.classList.contains('mobile-menu-active')) {
        document.querySelector('.main-content').style.opacity = '0';
        document.querySelector('.main-content').style.visibility = 'hidden';
      } else {
        document.querySelector('.main-content').style.opacity = '';
        document.querySelector('.main-content').style.visibility = '';
      }
    });
  
    observer.observe(document.body, {
      attributes: true,
      attributeFilter: ['class']
    });
  });

  // Controle do botão de menu
  document.getElementById('menuToggle').addEventListener('click', function() {
    const isMobilePortrait = window.innerWidth <= 768 && window.matchMedia("(orientation: portrait)").matches;

    if (isMobilePortrait) {
      document.body.classList.toggle('mobile-menu-active');
    }
  });

  // Controle dos links do menu lateral
  document.querySelectorAll('.sidebar .nav-link').forEach(link => {
    link.addEventListener('click', function (e) {
      const isMobilePortrait = window.innerWidth <= 768 && window.matchMedia("(orientation: portrait)").matches;
  
      if (!isMobilePortrait || this.target === '_blank') return;
  
      e.preventDefault(); // evita navegação imediata
  
      localStorage.setItem('showMainContent', 'true');
      document.body.classList.remove('show-main');
      document.body.classList.add('no-transition');
  
      const href = this.href;

      // AQUI: adiciona a classe para evitar flickering
      document.body.classList.add('show-main');
  
      // Use requestAnimationFrame para garantir sincronização
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          window.location.href = href;
        });
      });
    });
  });
</script>


<style>
  /* Adicione isso no final do seu CSS */
  body.no-transition .sidebar,
  body.no-transition .main-content {
    transition: none !important;
  }
</style>
</body>
