<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: "Pedro Henrique Nogueira" }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style_white.css' | relative_url }}">
  <!--<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <img src="{{ '/assets/profile.jpg' | relative_url }}" alt="Pedro Nogueira" class="profile-img">
    <h1 class="profile-name">Pedro Nogueira</h1>
    <p>Astrophysicist & Science Communicator</p>

    <!-- Navigation -->
    <nav class="main-nav">
      <a href="{{ '/' | relative_url }}" class="nav-link">Home</a>
      <a href="{{ '/about/' | relative_url }}" class="nav-link">About</a>
      <a href="{{ '/portfolio/' | relative_url }}" class="nav-link">Portfolio</a>
      <a href="{{ '/blog/' | relative_url }}" class="nav-link">Blog</a>
      <a href="{{ '/assets/CV.pdf' | relative_url }}" class="nav-link" target="_blank">CV</a>
    </nav>

    <!-- Redes Sociais (somente ícones e dispostos de forma horizontal) -->
    <div class="social-links">
      <a href="https://github.com/PedroNogueira404" target="_blank" class="social-link">
        <i class="fab fa-github"></i>
      </a>
      <a href="https://www.linkedin.com/in/pedro-henrique-nogueira-8a30571aa" target="_blank" class="social-link">
        <i class="fab fa-linkedin"></i>
      </a>
      <a href="https://youtube.com/@exopedrito" target="_blank" class="social-link">
        <i class="fab fa-youtube"></i>
      </a>
      <!-- Ícone do Bluesky (substituindo por um ícone de Twitter para agora) -->
      <a href="https://bsky.app/profile/nogueira-astro.bsky.social" class="social-link" target="_blank">
        <img src="/assets/bluesky-logo.svg" alt="Bluesky" class="social-icon" />
      </a>
    
      <!-- Ícone do X (novo logo) -->
      <a href="https://twitter.com/nogueira_astro" class="social-link" target="_blank">
        <img src="/assets/x-logo.svg" alt="X" class="social-icon" />
      </a>
      <!-- Ícone de e-mail -->
      <a href="mailto:nogueirapedro404@gmail.com" class="social-link">
        <i class="fas fa-envelope"></i>
      </a>
    </div>

    <!-- Language Switcher -->
    <div class="language-switcher">
      <a href="?lang=en" class="lang-link">English</a>
      <a href="?lang=pt" class="lang-link">Português</a>
      <a href="?lang=es" class="lang-link">Español</a>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    {{ content }}

    <!-- Theme Toggle Button -->
    <div class="switch-container">
      <label class="switch-label" for="theme-toggle">🌗</label>
      <label class="switch">
        <input type="checkbox" id="theme-toggle">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Comments Section (only on blog pages) -->
    {% if page.url contains '/blog/' %}
      <div class="comments-section" style="max-height: 400px; overflow-y: auto; margin-top: 2rem;">
        <div id="giscus_container"></div>
        <script src="https://giscus.app/client.js"
                data-repo="PedroNogueira404/PedroNogueira404.github.io"
                data-repo-id="R_kgDOOW9BoA"
                data-category="General"
                data-category-id="DIC_kwDOOW9BoM4Co8kQ"
                data-mapping="pathname"
                data-strict="0"
                data-reactions-enabled="1"
                data-emit-metadata="0"
                data-input-position="bottom"
                data-theme="preferred_color_scheme"
                data-lang="en"
                data-loading="lazy"
                data-comments-enabled="true"
                crossorigin="anonymous"
                async>
        </script>
      </div>
    {% endif %}

    <!-- Footer -->
    <footer class="site-footer">
      &copy; {{ 'now' | date: "%Y" }} Pedro Nogueira
    </footer>
  </div>

  <!-- Theme Switching Script -->
  <script>
    const toggle = document.getElementById('theme-toggle');
    const body = document.body;

    // Apply saved theme
    if (localStorage.getItem('theme') === 'light') {
      body.classList.add('light-mode');
      toggle.checked = true;
    }

    toggle.addEventListener('change', () => {
      const isLight = toggle.checked;
      body.classList.toggle('light-mode', isLight);
      localStorage.setItem('theme', isLight ? 'light' : 'dark');

      const giscusFrame = document.querySelector('iframe.giscus-frame');
      if (giscusFrame) {
        giscusFrame.contentWindow.postMessage({
          giscus: {
            setConfig: {
              theme: isLight ? 'light' : 'dark'
            }
          }
        }, 'https://giscus.app');
      }
    });
  </script>
</body>
</html>
